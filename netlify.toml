# Netlify build settings.
#
# There is no build step: the repository root IS the site, so `publish` points
# at it and no build command is declared at all. Declaring publish explicitly
# stops Netlify inspecting the repo, guessing a framework, and failing on a
# build that was never needed.
#
# Deliberately minimal. An earlier version added a [build.ignore] table to skip
# no-op deploys - that is not valid Netlify syntax (`ignore` is a key inside
# [build], not a subtable), and a marketing site that deploys a handful of
# times a month does not need the optimisation anyway.
#
# 404.html is picked up automatically for unmatched paths - no redirect rule
# required. Response headers live in _headers, which Cloudflare Pages also
# reads, so they survive a change of host.
#
# The www -> apex redirect is NOT set here on purpose: make the apex the
# primary domain in Netlify's Domain management panel and Netlify issues that
# redirect itself. A hand-written rule would race with it.

[build]
  publish = "."
